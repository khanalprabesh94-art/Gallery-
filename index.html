<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Makers Np - Portfolio</title>

  <!-- PRIVACY: Blocks Google, Bing, and Search Engine Bots -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noimageindex">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen px-4 py-8 sm:px-8">

  <!-- Header Section with Logo -->
  <header class="max-w-5xl mx-auto mb-10 text-center">
    <div class="inline-block p-4 rounded-2xl bg-slate-900 border border-slate-800 shadow-xl max-w-xs mb-4">
      <img src="IMG_20260808_142531.png" alt="Memory Makers Np Logo" class="w-full h-auto rounded-lg">
    </div>
    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white">Photography Portfolio</h1>
    <p class="text-slate-400 mt-2 text-sm sm:text-base">Pokhara, Nepal | Professional Cinematography & Photography</p>
  </header>

  <!-- Photo Gallery Grid -->
  <main class="max-w-6xl mx-auto">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

      <div class="group relative overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 aspect-[3/4] shadow-lg">
        <img src="FB_IMG_1786175655141.jpg" alt="Gallery Photo 1" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
      </div>

      <div class="group relative overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 aspect-[3/4] shadow-lg">
        <img src="FB_IMG_1786175647920.jpg" alt="Gallery Photo 2" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
      </div>

      <div class="group relative overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 aspect-[3/4] shadow-lg">
        <img src="FB_IMG_1786175645097.jpg" alt="Gallery Photo 3" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
      </div>

      <div class="group relative overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 aspect-[3/4] shadow-lg">
        <img src="FB_IMG_1786175642468.jpg" alt="Gallery Photo 4" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
      </div>

      <div class="group relative overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 aspect-[3/4] shadow-lg">
        <img src="FB_IMG_1786175634883.jpg" alt="Gallery Photo 5" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
      </div>

      <div class="group relative overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 aspect-[3/4] shadow-lg">
        <img src="FB_IMG_1786175639479.jpg" alt="Gallery Photo 6" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
      </div>

    </div>
  </main>

  <footer class="text-center text-slate-500 text-xs py-10 mt-10">
    <p>&copy; Memory Makers Np. All rights reserved.</p>
    <p class="mt-1">Pokhara, Nepal &bull; +977 980-5840488</p>
  </footer>

</body>
</html>
